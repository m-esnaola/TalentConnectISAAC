<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario TalentConnect</title>
</head>
<body>
    <h1>TalentConnect</h1>
    <form action="", method="POST" enctype="multipart/form-data">
        <h2>Datos del candidato</h2>
        <br>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre"/>
        <br>
        <br>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"/>
        <br>


        
        
        <br>
            Email: <input type="email" name="email" id="email">
        <br>
        
        <br>
            <label for="nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="nacimiento" name="nacimiento">
        <br>
        <br>
            <h2>¿Experiencia laboral?</h2>
        
            si <input type="radio" name="experiencia" value="si">
            no <input type="radio"name="experiencia" value="no">
        <br>
            
        
        <br>
            Tecnologias conocidas: <label for="direction"></label>
            <textarea name="Tecnologias" id="Tecnologias"></textarea>
        <br>

        <br>                              
            ¿Que idiomas hablas?<label for="direction"></label>
            <textarea name="idiomas" id="idiomas"></textarea>
        <br>
        <br>
            <input type="submit" value="Enviar">
        <br>



        

        






    </form>

</body>
</html>
