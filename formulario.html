<!DOCTYPE html>

<body class="pagina_formulario">
    <h1>TalentConnect</h1>
    <form action="" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend><b>Datos del candidato</b></legend>
            <label for="nombre"><b>Nombre:</b></label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre">
            <br>
            <label for="edad"><b>Edad:</b></label>
            <input type="number" id="edad" name="edad"/>
            <br>
            <b>Email: </b><input type="email" name="email" id="email">
            <br>
            <label for="nacimiento"><b>Fecha de nacimiento:</b></label>
            <input type="date" id="nacimiento" name="nacimiento">
            <br>
        </fieldset>
        
        <br>

        <fieldset>
            <label for="puesto" id="puesto"><b>Oferta a la que aplica: </b></label>
            <select name="puesto" id="puesto">
                <option value="DdAM">Desarrollo De Aplicaciones Moviles</option>
                <option value="DW">Desarrollo Web</option>
                <option value="GdBD">Gestion de bases de datos</option>
            </select>
     

        <div>
          <label for="experiencia" id="experiencia"><b>Años de experiencia: </b></label>
          <input type="number" id="experiencia" min="0" max="40" value="0">
        </div>
 

        <div>
            <span><b>Modalidad preferida: </b></span>
            <br>
                <label><input type="radio" name="modalidad" id="presencial" value="presencial">Presencial</label>
                <label><input type="radio" name="modalidad" id="remoto" value="remoto">Remoto</label>
                <label><input type="radio" name="modalidad" id="híbrido" value="híbrido">Híbrido</label>
            </div>
        </div>
    
        <div class="campo">
            <span><b>Habilidades: </b></span> <br>
            <div class="opciones">
                <label><input type="checkbox" id= "HTML" name="habilidades" value="HTML"> HTML</label>
                <label><input type="checkbox" id= "CSS" name="habilidades" value="CSS"> CSS</label>
                <label><input type="checkbox" id= "JavaScript" name="habilidades" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" id= "Python" name="habilidades" value="Python"> Python</label>
                <label><input type="checkbox" id= "SQL" name="habilidades" value="SQL"> SQL</label>
                <label><input type="checkbox" id= "Inglés" name="habilidades" value="Inglés"> Inglés</label> 
                <br>
                <b>Añade otra habilidad: </b><label><input type="text" name="habilidades" placeholder="Introduce otra habilidad"></label>
          </div>
        </div>

        <div class="idiomas">
            <span><b>Idiomas: </b></span>
            <div class="opciones">
            <label><input type="checkbox" id= "Castellano" name="idioma" value="Castellano">Castellano</label>
            <label><input type="checkbox" id= "Euskera" name="idioma" value="Euskera">Euskera</label>
            <label><input type="checkbox" id= "Inglés" name="idioma" value="Inglés">Inglés</label>
            <br>
            <b>Añade otro idioma: </b><label><input type="text" name="idioma" placeholder="Introduce otro idioma">
            </div>
        </div>
        
        </fieldset>

        <!-- Poner que este campo sea oblogatorio con "required" -->
        <br>

        <label class="acepto">
          <input type="radio" id="privacidad">  
          La persona candidata ha dado su consentimiento para el tratamiento de sus datos.
        </label>
          <p id="errores" class="error"></p>

        <div class="botones">
          <button type="submit" class="botonEnviar">Guardar CV</button>
          <button type="reset" class="botonBorrar">Limpiar</button>
        </div>
    </form>
