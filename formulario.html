<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario TalentConnect</title>

</head>
<body>
    <h1>TalentConnect</h1>
    <form action="" method="POST" enctype="multipart/form-data">

        <fieldset>
            <legend>Datos del candidato</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Introduce tu nombre">
            <br>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"/>
            <br>
            Email: <input type="email" name="email" id="email">
            <br>
            <label for="nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="nacimiento" name="nacimiento">
            <br>
        </fieldset>

        <div class="campo">
            <label for="puesto">Oferta a la que aplica</label>
            <select>
                <option >Desarrollo De Aplicaciones Moviles</option>
                <option >Desarrollo Web</option>
                <option >Gestion de bases de datos</option>
            </select>
        </div>

        <div class="campo">
          <label for="experiencia">Años de experiencia</label>
          <input type="number" id="experiencia" min="0" max="40" value="0">
        </div>
 
        <div class="campo">
            <span>Modalidad preferida</span>
            <div class="opciones">
                <label><input type="radio" name="modalidad" value="Presencial" checked> Presencial</label>
                <label><input type="radio" name="modalidad" value="Remoto"> Remoto</label>
                <label><input type="radio" name="modalidad" value="Híbrido"> Híbrido</label>
            </div>
        </div>
    
        <div class="campo">
            <span>Habilidades</span>
            <div class="opciones">
                <label><input type="checkbox" name="habilidades" value="HTML"> HTML</label>
                <label><input type="checkbox" name="habilidades" value="CSS"> CSS</label>
                <label><input type="checkbox" name="habilidades" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" name="habilidades" value="Python"> Python</label>
                <label><input type="checkbox" name="habilidades" value="SQL"> SQL</label>
                <label><input type="checkbox" name="habilidades" value="Inglés"> Inglés</label> 
                <br>
                Añade otra habilidad:<label><input type="text" name="habilidades" placeholder="Introduce otra habilidad"></label>
          </div>
        </div>

        <div class="idiomas">
            <span>Idiomas</span>
            <div class="opciones">
            <label><input type="checkbox" name="idioma" value="Castellano">Castellano</label>
            <label><input type="checkbox" name="idioma" value="Euskera">Euskera</label>
            <label><input type="checkbox" name="idioma" value="Inglés">Inglés</label>
            <br>
            Añade otro idioma:<label><input type="text" name="idioma" placeholder="Introduce otro idioma">
            </div>
        </div>
            
        <label class="acepto">
          <input type="radio" id="privacidad"> #Poner que este campo sea oblogatorio con "required"
          La persona candidata ha dado su consentimiento para el tratamiento de sus datos.
        </label>
          <p id="errores" class="error"></p>

        <div class="botones">
          <button type="submit" class="botonEnviar">Guardar CV</button>
          <button type="reset" class="botonBorrar">Limpiar</button>
        </div>
    </form>

    <script>
        function ValidarForm() {
            var nombre = document.getElementById("nombre").value;
            var edad = document.getElementById("edad").value;
            var nacimiento = document.getElementById("nacimiento").value;
            var email = document.getElementById("email").value;
            var experiencia = document.getElementById("experiencia").value;
            

        }

    </script>



</body>
</html>
